<style>
:root{
  --ink:#120E17;--card:#1D1624;--line:#2E2438;--rose:#E8507F;--gold:#F2C879;
  --mute:#A99BB7;--text:#F3EDF7;--bad:#FF8A8A;--good:#8FE3C9;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--text);
  font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;
  -webkit-tap-highlight-color:transparent}
body{padding-top:env(safe-area-inset-top,0px)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}

.center{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:32px 28px;gap:14px}
.word{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:4.2rem;line-height:1;letter-spacing:.01em;margin-top:6px}
.lead{color:var(--mute);max-width:21rem}
.fine{color:var(--mute);font-size:.85rem;max-width:20rem}

.page{max-width:30rem;margin:0 auto;padding:28px 20px 40px}
.shell{max-width:30rem;margin:0 auto;padding:0 20px calc(88px + env(safe-area-inset-bottom,0px))}
.h{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.9rem;line-height:1.15}
.muted{color:var(--mute)}
.top{display:flex;align-items:center;gap:10px;padding:18px 0 6px}
.brand{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.4rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;
  border-radius:16px;border:1px solid var(--line);background:transparent;font-weight:700;cursor:pointer;width:100%;max-width:21rem}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,#F0568A,#C2408F);box-shadow:0 10px 24px -12px rgba(232,80,127,.9)}
.btn.quiet{color:var(--mute)}

.form{display:flex;flex-direction:column;gap:16px;margin-top:22px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:500}
.field input[type=text],.field input[type=date],.field input[type=time],.field textarea,.field select{width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;outline:none}
.field input[type=text]:focus,.field input[type=date]:focus,.field input[type=time]:focus,.field textarea:focus,.field select:focus{border-color:var(--gold)}
.field select option{background:#1D1624;color:#F3EDF7}
.field textarea{resize:vertical;min-height:84px}
.hint{color:var(--mute);font-size:.85rem}
.check{display:flex;gap:12px;align-items:flex-start}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--rose);flex:none}
.msg{min-height:1.4em;font-size:.92rem;color:var(--bad)}
.msg.ok{color:var(--good)}

.list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:14px}
.row .who{min-width:0}
.row .nm{font-weight:700;overflow-wrap:anywhere}
.row .you{color:var(--gold);font-weight:500;margin-left:6px;font-size:.85rem}
.row .ct{color:var(--gold);font-size:.9rem}
.row .bio{color:var(--mute);font-size:.92rem;margin-top:4px;overflow-wrap:anywhere}
.empty{color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:18px}

.av{position:relative;flex:none;width:48px;height:48px;border-radius:50%;overflow:hidden;display:inline-block;

.av.big{width:64px;height:64px}
.me-card{display:flex;gap:14px;align-items:center;margin-top:18px}
.me-card .em{color:var(--mute);font-size:.9rem;overflow-wrap:anywhere}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;

.sep{height:1px;background:var(--line);margin:26px 0 8px}

.plan .pl{margin-top:10px}
.plan .note{color:var(--mute);margin-top:8px;overflow-wrap:anywhere}
.plan .by{color:var(--mute);font-size:.8rem;margin-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rsvps{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mini.on{background:linear-gradient(135deg,#F0568A,#C2408F);border-color:transparent;color:#fff}
.who2{margin-top:10px;color:var(--mute);font-size:.88rem;overflow-wrap:anywhere}

.msgs{display:flex;flex-direction:column;gap:8px;margin-top:14px}

.bub.me{align-self:flex-end;background:linear-gradient(135deg,#6b2650,#4d2a66);border-color:transparent}
.bub .who{font-size:.75rem;color:var(--gold);margin-bottom:2px;font-weight:500}
.bub .tm{font-size:.7rem;color:var(--mute);margin-top:3px;display:flex;gap:10px;justify-content:flex-end}
.day{align-self:center;font-size:.75rem;color:var(--mute);margin:6px 0;list-style:none;text-align:center}
.lnk{background:none;border:0;color:var(--mute);font-size:.7rem;text-decoration:underline;cursor:pointer;padding:0}
.shell.chat{padding-bottom:calc(175px + env(safe-area-inset-bottom,0px))}
.icon{flex:none;width:46px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:1.2rem;cursor:pointer}

.mv{display:block;max-width:100%;border-radius:12px;margin:4px 0}

.composer .btn.small{flex:none}

.btn.small{width:auto;flex:1;min-height:44px;padding:0 16px;font-size:.95rem}
.searchrow{display:flex;gap:8px;margin-top:14px}

.res small{display:block;color:var(--mute);font-weight:400;margin-top:2px}
.map{height:50vh;min-height:300px;margin-top:14px;border-radius:18px;overflow:hidden;border:1px solid var(--line);isolation:isolate;background:#241c2b}
.maptools{display:flex;gap:10px;margin-top:12px}
#hint,#mapmsg{margin-top:8px;min-height:1.2em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.sub{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.25rem}
.two{display:flex;gap:10px}

.row .pw{color:var(--gold);font-size:.9rem}
.row .by{color:var(--mute);font-size:.8rem;margin-top:6px}
.rowbtns{display:flex;gap:8px;margin-top:10px}
.mini{min-height:36px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-weight:700;font-size:.85rem;cursor:pointer}
.mini.bad{color:var(--bad)}
.row.click{cursor:pointer}
.pin{background:none;border:0}

.sosbox{margin-top:12px;padding:14px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}

#sosact{display:flex;flex-direction:column;gap:8px;margin-top:10px}

#sosact a.btn.alt{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}

.center .langbtn{margin:18px 0 0}

/* ---- Joyn_5 look ---- */
.top{padding:14px 0 4px}
.brand{color:var(--gold)}
.word{background:linear-gradient(90deg,#F2C879,#E8507F);-webkit-background-clip:text;background-clip:text;color:transparent}

.head .h{font-size:1.6rem;line-height:1.05}
.head .crumb{font-size:.74rem;color:var(--mute);margin-top:4px;line-height:1.3}

  box-shadow:0 14px 34px -22px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}
.row,.sosbox,.me-card{background-color:var(--card);border:1px solid var(--line);padding:16px}
.me-card{margin-top:16px}
.empty{border-radius:24px}
.sosbox{margin-top:12px}
.map{border-radius:24px}
.field input[type=text],.field input[type=date],.field input[type=time],.field textarea,.field select{border-radius:16px}
.mini{border-radius:999px}
.av b{font-family:'Fraunces',Georgia,serif;color:var(--ink)}
.bub{border-radius:18px 18px 18px 6px}
.bub.me{background:linear-gradient(135deg,#F0568A,#C2408F);color:#fff;border-radius:18px 18px 6px 18px}
.bub.me .tm,.bub.me .lnk{color:rgba(255,255,255,.85)}
.bub.sosmsg{border-radius:18px}
.composer input,.searchrow input{border-radius:999px;padding:0 18px}
.icon{border-radius:50%}
.tabs{gap:0;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(18,14,23,.88)}
.tabs button{flex:1;max-width:none;min-height:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:11px;font-weight:500;padding:0;border-radius:0;background:transparent;box-shadow:none;color:var(--mute)}
.tabs button .pill{display:flex;padding:4px 16px;border-radius:999px;transition:background .2s,color .2s}
.tabs button.on{background:transparent;box-shadow:none;color:var(--gold);font-weight:700}
.tabs button.on .pill{background:linear-gradient(135deg,#F7D58E,#E9B35E);color:var(--ink);box-shadow:0 6px 16px -6px rgba(242,200,121,.9)}
.composer{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
</style>

const HI_WORD = { going:'आ रहा हूँ', maybe:'शायद', "can't":'नहीं आ सकता' };
function trCore(c){
  if (Object.prototype.hasOwnProperty.call(HI, c)) return HI[c];
  let m;
  if ((m = /^(\d+) members?$/.exec(c))) return m[1] + ' सदस्य';
  if ((m = /^Added by (.*)$/.exec(c))) return m[1] + ' ने जोड़ा';
  if ((m = /^Planned by (.*)$/.exec(c))) return m[1] + ' ने बनाया';
  if ((m = /^(Going|Maybe|Can't) (\d+)$/.exec(c))) return HI_WORD[m[1].toLowerCase()] + ' ' + m[2];
  if ((m = /^Uploading video (\d+)%$/.exec(c))) return 'वीडियो अपलोड हो रहा है ' + m[1] + '%';
  if ((m = /^Uploading photo (\d+)%$/.exec(c))) return 'फ़ोटो अपलोड हो रही है ' + m[1] + '%';
  if ((m = /^This video is bigger than (\d+) MB\. Choose a shorter one\.$/.exec(c))) return 'ये वीडियो ' + m[1] + ' MB से बड़ा है। छोटा वीडियो चुनें।';
  if ((m = /^([\s\S]*) \u2014 show on map$/.exec(c))) return m[1] + ' \u2014 मैप पर देखें';
  if ((m = /^Something went wrong \(([\s\S]*)\)\.$/.exec(c))) return 'कुछ गड़बड़ हो गई (' + m[1] + ')।';
  if ((m = /^SOS could not be sent: ([\s\S]*)$/.exec(c))) return 'SOS नहीं जा सका: ' + m[1];
  if ((m = /^Could not send: ([\s\S]*)$/.exec(c))) return 'भेजा नहीं जा सका: ' + m[1];
  if ((m = /^Call(?: (.+))?$/.exec(c))) return 'कॉल करें' + (m[1] ? ' ' + m[1] : '');
  if ((m = /^Email(?: (.+))?$/.exec(c))) return 'ईमेल भेजें' + (m[1] ? ' ' + m[1] : '');
  return null;
}
function trText(raw){
  const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(raw);
  const core = m[2];
  if (!core) return raw;
  let out = trCore(core);
  if (out === null){
    const lm = /^([^\p{L}\p{N}"'(]+)([\s\S]+)$/u.exec(core);
    if (lm){ const o2 = trCore(lm[2]); if (o2 !== null) out = lm[1] + o2; }
  }
  return out === null ? raw : m[1] + out + m[3];
}
const tr = s => (LANG === 'hi' ? trText(s) : s);

const SKIP_SEL = '.bub:not(.tm), .nm, .ct, .bio, .pt, .note, .res';
function trNodeText(n){
  const par = n.parentElement;
  if (!par) return;
  const t = par.tagName;
  if (t === 'SCRIPT' || t === 'STYLE' || t === 'TEXTAREA') return;
  if (par.closest(SKIP_SEL) && !par.closest('.tm')) return;
  const v = trText(n.nodeValue);
  if (v !== n.nodeValue) n.nodeValue = v;
}
function trApply(root){
  if (LANG !== 'hi' || !root) return;
  if (root.nodeType === 3){ trNodeText(root); return; }
  if (root.nodeType !== 1) return;
  const els = [root].concat(Array.prototype.slice.call(root.querySelectorAll('[placeholder],[aria-label],[title]')));
  els.forEach(el => {
    ['placeholder', 'aria-label', 'title'].forEach(a => {
      const v = el.getAttribute && el.getAttribute(a);
      if (v){ const o = trText(v); if (o !== v) el.setAttribute(a, o); }
    });
  });
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const list = [];
  while (w.nextNode()) list.push(w.currentNode);
  list.forEach(trNodeText);
}
const trObserver = new MutationObserver(muts => {
  if (LANG !== 'hi') return;
  trObserver.disconnect();
  try {
    muts.forEach(m => {
      if (m.type === 'characterData') trApply(m.target);
      else m.addedNodes.forEach(trApply);
    });
  } catch (e) { /* ignore */ }
  trObserver.observe(document.body, { childList:true, subtree:true, characterData:true });
});
trObserver.observe(document.body, { childList:true, subtree:true, characterData:true });

  try { localStorage.setItem('joyn_lang', LANG); } catch (e) { /* ignore */ }
  document.documentElement.lang = LANG;
  render();
  if (LANG === 'hi') trApply(document.body);
}

/* ---------- map ---------- */
function pinIcon(emoji, cls){
  return L.divIcon({ className:'pin ' + (cls || ''), html:`<span><i>${emoji}</i></span>`,
                     iconSize:[34, 34], iconAnchor:[17, 36], popupAnchor:[0, -32] });
}

function popupHtml(p){
  const k = KIND[p.kind] || KIND.other;
  const mine = S.user && p.by === S.user.uid;
  return `<div class="pop"><b>${k.e} ${esc(p.title)}</b>
    ${p.dateText ? `<div class="pw">${esc(p.dateText)}</div>` : ''}
    ${p.note ? `<div>${esc(p.note)}</div>` : ''}
    <div class="pb">Added by ${esc(p.byName || 'someone')}</div>
    <a href="https://www.google.com/maps/search/?api=1&query=${Number(p.lat)},${Number(p.lng)}" target="_blank" rel="noopener">Open in Google Maps</a>
    ${mine ? `<button type="button" class="mini" data-del="${esc(p.id)}">Delete</button>` : ''}</div>`;
}

function initMap(){
  const el = $('map');
  if (!el) return;
  if (!window.L){
    el.innerHTML = '<div class="empty" style="margin:14px">The map could not load. Check your internet and reload the page.</div>';
    paintPlaces();
    return;
  }
  const v = S.view || { c:[22.5, 79], z:5 };
  S.map = L.map(el).setView(v.c, v.z);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(S.map);
  S.layer = L.layerGroup().addTo(S.map);
  S.map.on('click', e => { if (S.adding) setPending(e.latlng); });
  setTimeout(() => { if (S.map) S.map.invalidateSize(); }, 60);
  paintPlaces(true);
  if (S.focus){ const id = S.focus; S.focus = null; setTimeout(() => flyToPlace(id), 350); }
}

function destroyMap(){
  if (S.map){
    try {
      const c = S.map.getCenter();
      S.view = { c:[c.lat, c.lng], z:S.map.getZoom() };
      S.map.remove();
    } catch (e) { /* ignore */ }
  }
  S.map = null; S.layer = null; S.markers = {};
  S.pendMarker = null; S.userMarker = null; S.pending = null; S.adding = false;
}

function paintPlaces(first){
  if (S.map && S.layer){
    S.layer.clearLayers();
    S.markers = {};
    S.places.forEach(p => {
      const k = KIND[p.kind] || KIND.other;
      const m = L.marker([p.lat, p.lng], { icon: pinIcon(k.e) }).bindPopup(popupHtml(p));
      m.addTo(S.layer);
      S.markers[p.id] = m;
    });
    if (first && !S.view && S.places.length){
      S.map.fitBounds(L.latLngBounds(S.places.map(p => [p.lat, p.lng])), { padding:[40, 40], maxZoom:14 });
    }
  }
  const list = $('plist');
  if (!list) return;
  if (S.placesErr){
    list.innerHTML = `<li class="empty">${esc(S.placesErr)}</li>`;
    return;
  }
  if (!S.places.length){
    list.innerHTML = '<li class="empty">No places yet. Tap "+ Add a place" and pin the first one.</li>';
    return;
  }
  const ts = p => (p.createdAt && p.createdAt.toMillis) ? p.createdAt.toMillis() : Date.now();
  const me = S.user ? S.user.uid : '';
  list.innerHTML = S.places.slice().sort((a, b) => ts(b) - ts(a)).map(p => {
    const k = KIND[p.kind] || KIND.other;
    return `<li class="row click" data-fly="${esc(p.id)}"><span class="kind">${k.e}</span>
      <div class="who">
        <div class="nm">${esc(p.title)}</div>
        ${p.dateText ? `<div class="pw">${esc(p.dateText)}</div>` : ''}
        ${p.note ? `<div class="bio">${esc(p.note)}</div>` : ''}
        <div class="by">Added by ${esc(p.byName || 'someone')}</div>
        ${p.by === me ? `<div class="rowbtns"><button type="button" class="mini bad" data-del="${esc(p.id)}">Delete</button></div>` : ''}
      </div></li>`;
  }).join('');
}

function updateTools(){
  const b = $('addbtn'), h = $('hint');
  if (b) b.textContent = S.adding ? 'Cancel' : '+ Add a place';
  if (h) h.textContent = !S.adding ? ''
    : (S.pending ? 'Drag the pin to adjust, then fill in the details below.'
                 : 'Tap the map where the place is, or search for it above.');
}

function startAdd(){
  S.adding = true;
  updateTools();
}

function cancelAdd(){
  S.adding = false; S.pending = null;
  if (S.pendMarker && S.map){ try { S.map.removeLayer(S.pendMarker); } catch (e) { /* ignore */ } }
  S.pendMarker = null;
  const box = $('addbox');
  if (box) box.innerHTML = '';
  updateTools();
}

function setPending(ll, name){
  if (!S.map) return;
  S.pending = { lat:ll.lat, lng:ll.lng };
  if (S.pendMarker) S.pendMarker.setLatLng(ll);
  else {
    S.pendMarker = L.marker(ll, { icon: pinIcon('\uD83D\uDCCD', 'pend'), draggable:true }).addTo(S.map);
    S.pendMarker.on('dragend', () => { const q = S.pendMarker.getLatLng(); S.pending = { lat:q.lat, lng:q.lng }; });
  }
  showAddBox(name);
  updateTools();
}

function showAddBox(name){
  const box = $('addbox');
  if (!box) return;
  if (!$('pf-place')){
    box.innerHTML = `<form id="pf-place" class="form card" novalidate>
      <h3 class="sub">New place</h3>
      <div class="field"><label for="p-title">Name of the place</label>
        <input id="p-title" type="text" maxlength="60" autocomplete="off"></div>
      <div class="field"><label for="p-kind">Type</label>
        <select id="p-kind">${Object.keys(KIND).map(k => `<option value="${k}">${KIND[k].e} ${KIND[k].n}</option>`).join('')}</select></div>
      <div class="field"><label for="p-when">When (optional)</label>
        <input id="p-when" type="text" maxlength="40" placeholder="For example: Sat 5 Dec, evening" autocomplete="off"></div>
      <div class="field"><label for="p-note">Note (optional)</label>
        <textarea id="p-note" maxlength="200" placeholder="Why this place?"></textarea></div>
      <p id="pmsg" class="msg" role="alert"></p>
      <div class="two"><button class="btn primary" type="submit">Save place</button>
        <button class="btn" type="button" data-act="canceladd">Cancel</button></div>
    </form>`;
    if (box.scrollIntoView) box.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
  if (name && $('p-title') && !$('p-title').value) $('p-title').value = String(name).slice(0, 60);

async function savePlace(){
  if (S.busy) return;
  const pm = t => { const el = $('pmsg'); if (el) el.textContent = t || ''; };
  const title = val('p-title').trim();
  if (!title) return pm('Enter the name of the place.');
  if (!S.pending) return pm('Tap the map to choose the spot first.');
  const kind = KIND[val('p-kind')] ? val('p-kind') : 'other';
  pm('');
  S.busy = true;
  const btn = document.querySelector('#pf-place button[type=submit]');
  if (btn) btn.disabled = true;
  try {
    await addDoc(collection(db, 'places'), {
      title, kind,
      note: val('p-note').trim(),
      dateText: val('p-when').trim(),
      lat: Number(S.pending.lat.toFixed(6)),
      lng: Number(S.pending.lng.toFixed(6)),
      by: S.user.uid,
      byName: (S.profile && S.profile.name) || '',
      createdAt: serverTimestamp()
    });
    cancelAdd();
  } catch (e) {
    pm(friendly(e));
  } finally {
    S.busy = false;
    const b2 = document.querySelector('#pf-place button[type=submit]');
    if (b2) b2.disabled = false;
  }
}

async function deletePlace(id){
  if (!confirm(tr('Delete this place?'))) return;
  try { await deleteDoc(doc(db, 'places', id)); }
  catch (e) { const m = $('mapmsg'); if (m) m.textContent = friendly(e); }
}

function flyToPlace(id){
  const p = S.places.find(x => x.id === id);
  if (!p || !S.map) return;
  S.map.flyTo([p.lat, p.lng], Math.max(S.map.getZoom(), 15));
  const m = S.markers[id];
  if (m) setTimeout(() => { try { m.openPopup(); } catch (e) { /* ignore */ } }, 700);
  const el = $('map');
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior:'smooth', block:'center' });
}

async function searchPlace(){
  const out = $('results');
  if (!out) return;
  const q = val('q').trim();
  if (q.length < 2){ out.innerHTML = ''; return; }
  out.innerHTML = '<p class="hint" style="margin-top:8px">Searching\u2026</p>';
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q=' + encodeURIComponent(q),
      { headers:{ 'Accept':'application/json' } });
    if (!r.ok) throw new Error('search failed');
    const arr = await r.json();
    S.results = arr.map(x => ({
      lat: parseFloat(x.lat), lng: parseFloat(x.lon),
      name: String(x.name || String(x.display_name || '').split(',')[0] || '').trim(),
      full: String(x.display_name || '')
    })).filter(x => isFinite(x.lat) && isFinite(x.lng));
    out.innerHTML = S.results.length
      ? S.results.map((x, i) => `<button type="button" class="res" data-res="${i}">${esc(x.name || x.full)}<small>${esc(x.full)}</small></button>`).join('')
      : '<p class="hint" style="margin-top:8px">Nothing found. Try another name, or add the city.</p>';
  } catch (e) {
    out.innerHTML = '<p class="msg" style="margin-top:8px">Search is not working right now. You can still tap the map.</p>';
  }
}

function pickResult(i){
  const x = S.results[i];
  if (!x || !S.map) return;
  const out = $('results');
  if (out) out.innerHTML = '';
  S.map.flyTo([x.lat, x.lng], 16);
  startAdd();
  setPending({ lat:x.lat, lng:x.lng }, x.name);
}

function locateMe(){
  const m = $('mapmsg');
  const say = t => { if (m) m.textContent = t || ''; };
  if (!S.map) return;
  if (!navigator.geolocation) return say('This browser cannot share your location.');
  say('Finding you\u2026');
  navigator.geolocation.getCurrentPosition(pos => {
    if (!S.map) return;
    say('Only you can see this blue dot.');
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (S.userMarker) S.userMarker.setLatLng(ll);
    else S.userMarker = L.circleMarker(ll, { radius:8, color:'#ffffff', weight:3, fillColor:'#2f7df6', fillOpacity:1 }).addTo(S.map);
    S.map.flyTo(ll, 15);
  }, () => say('Could not get your location. Check that location is allowed for this website.'),
  { enableHighAccuracy:true, timeout:12000 });
}

/* ---------- plans ---------- */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtDate(str){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
  if (!m) return esc(str || '');
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString(LOC(), { weekday:'short', day:'numeric', month:'short' });
}
function fmtTime(t){
  const m = /^(\d{2}):(\d{2})$/.exec(t || '');
  if (!m) return '';
  let h = +m[1];
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + m[2] + ' ' + ap;
}

function setRsvpDoc(planId, status){
  return setDoc(doc(db, 'rsvps', planId + '_' + S.user.uid), {

async function savePlan(){
  if (S.busy) return;
  const nm = t => { const el = $('nmsg'); if (el) el.textContent = t || ''; };
  const title = val('n-title').trim();
  const date = val('n-date');
  if (!title) return nm('Enter what the plan is.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return nm('Choose a date.');
  const pl = S.places.find(x => x.id === val('n-place'));
  nm('');
  S.busy = true;
  const btn = document.querySelector('#pf-plan button[type=submit]');
  if (btn) btn.disabled = true;
  try {
    const ref = await addDoc(collection(db, 'plans'), {
      title, date,
      time: val('n-time') || '',
      placeId: pl ? pl.id : '',
      placeTitle: pl ? String(pl.title).slice(0, 60) : '',
      note: val('n-note').trim(),
      by: S.user.uid,
      byName: (S.profile && S.profile.name) || '',
      createdAt: serverTimestamp()
    });
    try { await setRsvpDoc(ref.id, 'going'); } catch (e2) { /* ignore */ }
    const box = $('planbox');
    if (box) box.innerHTML = '';
  } catch (e) {
    nm(friendly(e));
  } finally {
    S.busy = false;
    const b2 = document.querySelector('#pf-plan button[type=submit]');
    if (b2) b2.disabled = false;
  }
}

async function toggleRsvp(planId, status){
  const mine = S.rsvps.find(r => r.planId === planId && r.uid === S.user.uid);
  try {
    if (mine && mine.status === status) await deleteDoc(doc(db, 'rsvps', planId + '_' + S.user.uid));
    else await setRsvpDoc(planId, status);
  } catch (e) {
    S.plansErr = friendly(e); paintPlans();
  }
}

async function deletePlan(id){
  if (!confirm(tr('Delete this plan?'))) return;
  try { await deleteDoc(doc(db, 'plans', id)); }
  catch (e) { S.plansErr = friendly(e); paintPlans(); }
}

function planCard(p){
  const me = S.user ? S.user.uid : '';
  const rs = S.rsvps.filter(r => r.planId === p.id);
  const mine = rs.find(r => r.uid === me);
  const by = st => rs.filter(r => r.status === st);
  const names = st => by(st).map(r => esc(r.name || 'someone')).join(', ');
  const btn = (st, label) => `<button type="button" class="mini${mine && mine.status === st ? ' on' : ''}" data-rsvp="${st}" data-plan="${esc(p.id)}">${label} ${by(st).length}</button>`;
  const when = fmtDate(p.date) + (p.time ? ' \u00B7 ' + esc(fmtTime(p.time)) : '');
  const placeOk = p.placeId && S.places.some(x => x.id === p.placeId);
  return `<li class="plan card">
    <div class="pt">${esc(p.title)}</div>
    <div class="pwhen">&#128197; ${when}</div>
    ${p.placeTitle ? (placeOk
      ? `<div class="pl"><button type="button" class="mini" data-goplace="${esc(p.placeId)}">&#128205; ${esc(p.placeTitle)} \u2014 show on map</button></div>`
      : `<div class="pl hint">&#128205; ${esc(p.placeTitle)}</div>`) : ''}
    ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
    <div class="rsvps">${btn('going', 'Going')}${btn('maybe', 'Maybe')}${btn('no', "Can't")}</div>
    ${by('going').length ? `<div class="who2"><b>Going:</b> ${names('going')}</div>` : ''}
    ${by('maybe').length ? `<div class="who2"><b>Maybe:</b> ${names('maybe')}</div>` : ''}
    <div class="by"><span>Planned by ${esc(p.byName || 'someone')}</span>
      ${p.by === me ? `<button type="button" class="lnk" data-delplan="${esc(p.id)}">Delete plan</button>` : ''}</div>
  </li>`;
}

function paintPlans(){
  const list = $('planlist');
  if (!list) return;
  if (S.plansErr){ list.innerHTML = `<li class="empty">${esc(S.plansErr)}</li>`; return; }
  if (!S.plans.length){ list.innerHTML = '<li class="empty">No plans yet. Tap "+ New plan" and invite everyone.</li>'; return; }
  const today = todayStr();
  const key = p => (p.date || '') + ' ' + (p.time || '00:00');
  const up = S.plans.filter(p => (p.date || '') >= today).sort((a, b) => key(a) < key(b) ? -1 : 1);
  const past = S.plans.filter(p => (p.date || '') < today).sort((a, b) => key(a) < key(b) ? 1 : -1);
  list.innerHTML = up.map(planCard).join('') +
    (past.length ? '<li class="day">Earlier</li>' + past.map(planCard).join('') : '');
}

/* ---------- chat ---------- */
function tms(m){ return (m.createdAt && m.createdAt.toMillis) ? m.createdAt.toMillis() : Date.now(); }
function dayLabel(d){
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((t - x) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString(LOC(), { day:'numeric', month:'short' });
}
function timeLabel(d){ return d.toLocaleTimeString(LOC(), { hour:'numeric', minute:'2-digit' }); }

function paintChat(){
  const box = $('msgs');
  if (!box) return;
  if (S.chatErr){ box.innerHTML = `<div class="empty">${esc(S.chatErr)}</div>`; return; }
  const atBottom = (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 160);
  if (!S.msgs.length){
    box.innerHTML = '<div class="empty">No messages yet. Say hello to your group!</div>';
    return;
  }
  const me = S.user ? S.user.uid : '';
  let last = '';
  box.innerHTML = S.msgs.slice().sort((a, b) => tms(a) - tms(b)).map(m => {
    const d = new Date(tms(m));
    const day = dayLabel(d);
    let sep = '';
    if (day !== last){ sep = `<div class="day">${esc(day)}</div>`; last = day; }
    const mine = m.by === me;
    const isSos = typeof m.text === 'string' && m.text.indexOf('SOS!') === 0;
    return sep + `<div class="bub${mine ? ' me' : ''}${isSos ? ' sosmsg' : ''}">
      ${mine ? '' : `<div class="who">${esc(m.byName || 'someone')}</div>`}
      ${mediaHtml(m)}
      ${m.text ? `<div>${isSos ? sosText(m.text) : esc(m.text)}</div>` : ''}
      <div class="tm"><span>${esc(timeLabel(d))}</span>${mine ? `<button type="button" class="lnk" data-delmsg="${esc(m.id)}">Delete</button>` : ''}</div>
    </div>`;
  }).join('');
  const stick = S.chatFirst || atBottom;
  if (stick){ S.chatFirst = false; window.scrollTo(0, document.body.scrollHeight); }
  box.querySelectorAll('img.mv').forEach(im => {
    if (!im.complete) im.addEventListener('load', () => { if (stick) window.scrollTo(0, document.body.scrollHeight); });
  });
}

async function sendMessage(){
  const el = $('cmsg');
  if (!el) return;
  const text = el.value.trim();
  if (!text) return;
  el.value = '';
  try {
    await addDoc(collection(db, 'messages'), {
      text: text.slice(0, 500),
      by: S.user.uid,
      byName: (S.profile && S.profile.name) || '',
      createdAt: serverTimestamp()
    });
  } catch (e) {
    el.value = text;
    S.chatErr = friendly(e); paintChat();
  }
  if (el.focus) el.focus();
}

async function deleteMessage(id){
  if (!confirm(tr('Delete this message?'))) return;
  try { await deleteDoc(doc(db, 'messages', id)); }
  catch (e) { S.chatErr = friendly(e); paintChat(); }
}

/* ---------- photos and videos ---------- */
function mediaHtml(m){
  const md = m && m.media;
  if (!md || typeof md.url !== 'string' || !md.url.startsWith('https://res.cloudinary.com/')) return '';
  if (md.type === 'video'){
    return `<video class="mv" src="${esc(md.url)}" controls playsinline preload="metadata"></video>`;
  }
  const small = md.url.replace('/upload/', '/upload/c_limit,w_900,q_auto,f_auto/');
  return `<a href="${esc(md.url)}" target="_blank" rel="noopener"><img class="mv" src="${esc(small)}" alt="Photo" loading="lazy"></a>`;
}

function shrinkImage(file){
  return new Promise(resolve => {
    if (file.type === 'image/gif'){ resolve(file); return; }
    const img = new Image();
    const u = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(u);
      let w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h){ resolve(file); return; }
      const k = Math.min(1, 1600 / Math.max(w, h));
      w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(b => resolve(b && b.size < file.size ? b : file), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(u); resolve(file); };
    img.src = u;
  });
}

function uploadToCloudinary(blob, name, onPct){
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append('file', blob, name || 'upload');
    fd.append('upload_preset', CLD_PRESET);
    const x = new XMLHttpRequest();
    x.open('POST', 'https://api.cloudinary.com/v1_1/' + CLD_CLOUD + '/auto/upload');
    x.upload.onprogress = e => { if (e.lengthComputable) onPct(Math.round(e.loaded * 100 / e.total)); };
    x.onload = () => {
      try {
        const j = JSON.parse(x.responseText);
        if (x.status >= 200 && x.status < 300) resolve(j);
        else reject(new Error((j.error && j.error.message) || 'upload failed'));
      } catch (e) { reject(e); }
    };
    x.onerror = () => reject(new Error('no internet'));
    x.send(fd);
  });
}

async function handleFile(file){
  if (!file || S.uploading) return;
  const st = t => { const el = $('cstat'); if (el) el.textContent = t || ''; };
  const isImg = String(file.type).startsWith('image/');
  const isVid = String(file.type).startsWith('video/');
  const MB = 1024 * 1024;
  if (!isImg && !isVid) return st('Choose a photo or a video.');
  if (isVid && file.size > MAX_VIDEO_MB * MB) return st('This video is bigger than ' + MAX_VIDEO_MB + ' MB. Choose a shorter one.');
  if (isImg && file.size > 40 * MB) return st('This photo is too big.');
  S.uploading = true;
  st('Getting ready\u2026');
  try {
    let blob = file;
    if (isImg){
      blob = await shrinkImage(file);
      if (blob.size > 10 * MB) throw new Error('The photo is bigger than 10 MB');
    }
    const res = await uploadToCloudinary(blob, file.name, pct => st((isVid ? 'Uploading video ' : 'Uploading photo ') + pct + '%'));
    const url = String(res.secure_url || '');
    if (!url.startsWith('https://res.cloudinary.com/')) throw new Error('unexpected reply');
    st('Sending\u2026');
    const input = $('cmsg');
    const text = input ? input.value.trim().slice(0, 500) : '';
    await addDoc(collection(db, 'messages'), {
      text,
      media: { url, type: res.resource_type === 'video' ? 'video' : 'image' },
      by: S.user.uid,
      byName: (S.profile && S.profile.name) || '',
      createdAt: serverTimestamp()
    });
    if (input) input.value = '';
    st('');
  } catch (e) {
    st(e && e.code ? friendly(e) : 'Could not send: ' + ((e && e.message) || 'unknown problem'));
  } finally {
    S.uploading = false;
  }
}

/* ---------- actions ---------- */
async function login(){
  if (S.busy) return;
  setMsg('');
  setBusy(true);
  const provider = new GoogleAuthProvider();
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment'){
      try { await signInWithRedirect(auth, provider); return; } catch (e2) { e = e2; }
    }
    if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') setMsg(friendly(e));
  } finally {
    setBusy(false);
  }
}

async function logout(){
  try { await signOut(auth); } catch (e) { /* ignore */ }
}

async function saveProfile(isNew){
  if (S.busy) return;
  const name = val('f-name').trim();
  const city = val('f-city').trim();
  const bio  = val('f-bio').trim();
  if (name.length < 2) return setMsg('Enter your name (at least 2 letters).');
  const code = val('f-code').trim().toLowerCase();
  if (isNew && !code) return setMsg('Enter the group code.');
  if (isNew && !($('f-age') && $('f-age').checked)) return setMsg('Please confirm that you are 18 or older.');
  setMsg('');
  setBusy(true);
  try {
    const data = { name, city, bio, photoURL: S.user.photoURL || '', updatedAt: serverTimestamp() };
    if (isNew){ data.age18 = true; data.createdAt = serverTimestamp(); data.inviteCode = code; }
    await setDoc(doc(db, 'users', S.user.uid), data, { merge: true });
    S.profile = Object.assign({}, S.profile || {}, { name, city, bio, photoURL: data.photoURL });
    if (isNew){ startMembers(); render(); }
    else { setMsg('Saved.', true); }
  } catch (e) {
    if (isNew && e.code === 'permission-denied') setMsg('That group code is not correct. Check it and try again.');
    else setMsg(friendly(e));
  } finally {
    setBusy(false);
  }
}

function saveSosContact(){
  const say = t => { const el = $('sosmsg'); if (el) el.textContent = t || ''; };
  const name = val('sos-name').trim().slice(0, 40);
  const phone = val('sos-phone').trim().slice(0, 16);
  const mail = val('sos-mail').trim().slice(0, 80);
  if (!phone && !mail) return say('Enter a phone number or an email first.');
  if (phone && sosPhone(phone).length < 11) return say('Phone number looks wrong. Enter 10 digits.');
  if (mail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return say('Email looks wrong.');
  try { localStorage.setItem('joyn_sos', JSON.stringify({ name, phone, mail })); }
  catch (e) { return say('Could not save on this phone.'); }
  say('Emergency contact saved.');
}

function showSosActions(text){
  const box = $('sosact');
  if (!box) return;
  const c = sosGet();
  const ph = sosPhone(c.phone);
  const who = c.name ? ' ' + esc(c.name) : '';
  const enc = encodeURIComponent(text);
  let h = '';
  if (ph.length >= 11){
    h += `<a class="btn" href="https://wa.me/${ph}?text=${enc}" target="_blank" rel="noopener">WhatsApp${who}</a>`;
    h += `<a class="btn" href="sms:+${ph}?body=${enc}">SMS${who}</a>`;
    h += `<a class="btn alt" href="tel:+${ph}">Call${who}</a>`;
  }
  if (c.mail && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.mail)){
    h += `<a class="btn alt" href="mailto:${esc(c.mail)}?subject=${encodeURIComponent('SOS from Joyn')}&body=${enc}">Email${who}</a>`;
  }
  if (!h) h = '<p class="hint">No emergency contact saved yet. Save one below so next time you can alert them too.</p>';
  box.innerHTML = h;
}

/* ---------- SOS ---------- */
function sosText(t){
  const re = /https:\/\/www\.google\.com\/maps\?q=-?\d{1,3}\.\d+,-?\d{1,3}\.\d+/;
  const mt = String(t).match(re);
  if (!mt) return '&#127384; ' + esc(t);
  const rest = String(t).replace(mt[0], '').trim();
  return '&#127384; ' + esc(rest) + `<br><a href="${mt[0]}" target="_blank" rel="noopener">Open location on map</a>`;
}

async function sendSos(){
  if (S.sosBusy) return;
  const say = t => { document.querySelectorAll('#sosmsg').forEach(el => { el.textContent = t || ''; }); };
  if (!confirm(tr('Send an SOS to your whole group with your location?'))) return;
  S.sosBusy = true;
  say('Finding your location\u2026');
  const name = (S.profile && S.profile.name) || 'Someone';
  const getPos = () => new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res(p), () => res(null), { enableHighAccuracy:true, timeout:12000, maximumAge:0 });
  });
  try {
    const pos = await getPos();
    const hi = LANG === 'hi';
    let text = hi ? ('SOS! ' + name + ' को मदद चाहिए।') : ('SOS! ' + name + ' needs help.');
    if (pos){
      text += (hi ? ' लोकेशन: ' : ' Location: ') + 'https://www.google.com/maps?q=' + pos.coords.latitude.toFixed(6) + ',' + pos.coords.longitude.toFixed(6);
    } else {
      text += hi ? ' लोकेशन नहीं मिली - कृपया उन्हें कॉल करें।' : ' Location not available - please call them.';
    }
    await addDoc(collection(db, 'messages'), {
      text: text.slice(0, 500),
      by: S.user.uid,
      byName: name,
      createdAt: serverTimestamp()
    });
    say(pos ? 'SOS sent to the group chat. Now tap a green button to alert your emergency contact.' : 'SOS sent to the group chat, but your location could not be found. Allow location for this website.');
    showSosActions(text);
  } catch (e) {
    say('SOS could not be sent: ' + ((e && e.code) ? friendly(e) : ((e && e.message) || 'unknown problem')) + ' Please call someone you trust.');
  } finally {
    S.sosBusy = false;
  }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-del],[data-fly],[data-res],[data-rsvp],[data-goplace],[data-delplan],[data-delmsg]');
  if (!t) return;
  if (t.dataset.tab){ S.tab = t.dataset.tab; render(); return; }
  if (t.dataset.rsvp){ toggleRsvp(t.dataset.plan, t.dataset.rsvp); return; }
  if (t.dataset.goplace){ S.focus = t.dataset.goplace; S.tab = 'map'; render(); return; }
  if (t.dataset.delplan){ deletePlan(t.dataset.delplan); return; }
  if (t.dataset.delmsg){ deleteMessage(t.dataset.delmsg); return; }
  if (t.dataset.del){ deletePlace(t.dataset.del); return; }
  if (t.dataset.res !== undefined){ pickResult(Number(t.dataset.res)); return; }
  if (t.dataset.fly){ flyToPlace(t.dataset.fly); return; }
  const a = t.dataset.act;
  if (a === 'login') login();
  else if (a === 'logout') logout();
  else if (a === 'sos') sendSos();
  else if (a === 'lang') toggleLang();
  else if (a === 'savesos') saveSosContact();
  else if (a === 'reload') location.reload();
  else if (a === 'locate') locateMe();
  else if (a === 'addmode'){ if (S.adding) cancelAdd(); else startAdd(); }
  else if (a === 'canceladd') cancelAdd();
  else if (a === 'newplan') showPlanForm();
  else if (a === 'attach'){ const f = $('cfile'); if (f) f.click(); }
  else if (a === 'cancelplan'){ const bx = $('planbox'); if (bx) bx.innerHTML = ''; }
});
document.addEventListener('change', e => {
  if (e.target && e.target.id === 'cfile'){
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    handleFile(f);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'pf-new') saveProfile(true);
  else if (e.target.id === 'pf-edit') saveProfile(false);
  else if (e.target.id === 'pf-place') savePlace();
  else if (e.target.id === 'search-form') searchPlace();
  else if (e.target.id === 'pf-plan') savePlan();
  else if (e.target.id === 'chat-form') sendMessage();
});

function startMembers(){
  if (!S.unsub){
    S.unsub = onSnapshot(collection(db, 'users'),
      snap => { S.listErr = ''; S.members = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); paintMembers(); },
      e => { S.unsub = null; S.listErr = friendly(e); paintMembers(); });
  }
  if (!S.unsubP){
    S.unsubP = onSnapshot(collection(db, 'places'),
      snap => {
        S.placesErr = '';
        S.places = snap.docs.map(d => Object.assign({ id: d.id }, d.data()))
          .filter(p => isFinite(p.lat) && isFinite(p.lng));
        paintPlaces();
      },
      e => { S.unsubP = null; S.placesErr = friendly(e); paintPlaces(); });
  }
  if (!S.unsubPl){
    S.unsubPl = onSnapshot(collection(db, 'plans'),
      snap => {
        S.plansErr = '';
        S.plans = snap.docs.map(d => Object.assign({ id: d.id }, d.data({ serverTimestamps:'estimate' })));
        paintPlans();
      },
      e => { S.unsubPl = null; S.plansErr = friendly(e); paintPlans(); });
  }
  if (!S.unsubR){
    S.unsubR = onSnapshot(collection(db, 'rsvps'),
      snap => { S.rsvps = snap.docs.map(d => d.data()); paintPlans(); },
      e => { S.unsubR = null; S.plansErr = friendly(e); paintPlans(); });
  }
  if (!S.unsubM){
    S.unsubM = onSnapshot(query(collection(db, 'messages'), orderBy('createdAt', 'desc'), limit(100)),
      snap => {
        S.chatErr = '';
        S.msgs = snap.docs.map(d => Object.assign({ id: d.id }, d.data({ serverTimestamps:'estimate' })));
        paintChat();
      },
      e => { S.unsubM = null; S.chatErr = friendly(e); paintChat(); });
  }
}

/* ---------- start ---------- */
render();
onAuthStateChanged(auth, async u => {
  if (S.unsub){ S.unsub(); S.unsub = null; }
  if (S.unsubP){ S.unsubP(); S.unsubP = null; }
  if (S.unsubPl){ S.unsubPl(); S.unsubPl = null; }
  if (S.unsubR){ S.unsubR(); S.unsubR = null; }
  if (S.unsubM){ S.unsubM(); S.unsubM = null; }
  destroyMap();
  S.user = u; S.profile = null; S.members = []; S.places = []; S.view = null;
  S.plans = []; S.rsvps = []; S.msgs = [];
  S.loadErr = ''; S.listErr = ''; S.placesErr = ''; S.plansErr = ''; S.chatErr = ''; S.tab = 'map';
  if (u){
    try {
      const snap = await getDoc(doc(db, 'users', u.uid));
      S.profile = snap.exists() ? snap.data() : null;
    } catch (e) {
      S.loadErr = friendly(e);
    }
    if (S.profile) startMembers();
  }
  S.ready = true;
  render();
});
</script>
