function PlaceSuggest({value,onPick}){const [l,setL]=useState([]);const last=useRef('');

 useEffect(()=>{const q=(value||'').trim();if(q.length<3){setL([]);return}if(q===last.current)return;
  const t=setTimeout(async()=>{const lat=UPOS?UPOS.lat:22.5,lon=UPOS?UPOS.lon:79;const out=[];
   try{const r=await fetch('https://photon.komoot.io/api/?limit=6&lang=en&location_bias_scale='+(UPOS?'0.8':'0.2')+'&lat='+lat+'&lon='+lon+'&q='+encodeURIComponent(q));const j=await r.json();

   const seen={};setL(out.filter(v=>{const k=v.toLowerCase();if(seen[k])return false;seen[k]=1;return true}).slice(0,8))},700);return()=>clearTimeout(t)},[value]);

 const publish=p=>{const id=Date.now();if(p.kind==='Meetup'){setPub(a=>[{id,t:p.title,who:'You',when:(p.day==='Later'?'':(p.day==='Today'?'Today, ':'This weekend, '))+p.date,kind:'Meetup',day:p.day,place:p.place,meet:p.meet,group:false,spots:1,tag:p.tag,joined:false,dur:p.dur,img:p.img,look:p.look,notes:p.notes||'',rec:p.rep&&p.rep!=='Does not repeat'?p.rep:''},...a])}else if(p.kind==='Trip'){setPub(a=>[{id,t:p.title,who:'You',when:p.date,kind:'Trip',day:'Later',place:p.place,meet:'Shared in the group chat',group:true,spots:p.cap,cap:p.cap,notes:p.notes||'',tag:'Trip',joined:false,buddy:true,img:p.img,aud:p.aud,approve:p.appr,chk:p.chk},...a]);addGroup({t:p.title})}else{setPub(a=>[{id,t:p.title,org:'You',when:p.date,venue:p.place,fee:0,cap:p.cap,left:p.cap,who:'Couples & Singles',rule:'18+ · '+p.plan.length+' schedule items',notes:p.notes||'',ap:true,st:'',kind:'Event',img:p.img},...a])}};
 const updPub=(id,patch)=>setPub(a=>a.map(z=>z.id===id?{...z,...patch}:z));
 const remind=n=>setTimeout(()=>note('⏰ Reminder: “'+n+'” starts in 1 hour',{cat:'plans'}),8000);
 const DN=['Aria','Rohan','Kabir','Meera','Sam'];
 const demoJoin=x=>{const ev=x.kind==='Event';const sp=ev?x.left:x.spots;if(!(sp>0)){toast('This plan is already full');return}const m=x.mem||[];const nm=DN[m.length%DN.length];updPub(x.id,{mem:[...m,nm],...(ev?{left:x.left-1}:{spots:x.spots-1})});note(nm+' joined “'+x.t+'”',{cat:'plans'});const k='Group · '+x.t;setMsgs(a=>a[k]?{...a,[k]:[...a[k],{me:false,x:nm+' joined the plan 👋'}]}:a);toast(nm+' joined your plan (demo)')};
 const onEdit=(x,patch,ch,n)=>{updPub(x.id,patch);if(!ch.length){toast('No changes made');return}const k='Group · '+(x.t);
  note('You updated “'+(patch.t||x.t)+'”: '+ch.join(', ')+(n>0?'. '+n+' member'+(n>1?'s were':' was')+' notified.':''));
  if(n>0)setMsgs(m=>m[k]?{...m,[k]:[...m[k],{me:false,x:'📝 Host update: '+ch.join(', ')+' changed. Please check the plan details.'}]}:m);
  toast(n>0?'Saved. Members were notified.':'Changes saved')};
 const onCancel=(x,why,n,rs)=>{setPub(a=>a.map(z=>z.id===x.id?{...z,status:'cancelled',why}:z));const k='Group · '+x.t;
  note('You cancelled “'+x.t+'”.'+(n>0?' '+n+' member'+(n>1?'s were':' was')+' notified. Reason: '+why:' Reason saved: '+why));
  if(n>0)setMsgs(m=>m[k]?{...m,[k]:[...m[k],{me:false,x:'⚠️ The host cancelled this plan. Reason: '+why+'. Sorry for the change.'+(rs?' A new date may be shared soon.':'')}]}:m);
  toast(n>0?'Plan cancelled. Members were notified.':'Plan cancelled')};
 const askVouch=()=>{toast('Vouch request sent to members you have met');setTimeout(()=>{setMyVouches(v=>v+1);note('Mara & Eli vouched for you ✓')},2500)};
 const addStory=s=>setStories(a=>[{id:Date.now(),t:'just now',...s},...a]);
 const updStory=(id,fn)=>setStories(a=>a.map(z=>z.id===id?fn(z):z));const delStory=id=>setStories(a=>a.filter(z=>z.id!==id));
 const onAct=(id,v)=>setNotes(a=>a.map(z=>z.id===id?{...z,done:v}:z));
 const onDelete=async()=>{try{await FB.wipeMe()}catch(e){}FB.logout()};
 const tabs=[['discover','Home','home'],['dating','Dating','heart'],['events','Events','events'],['trips','Trips','trips'],['groups','Groups','groups'],['me','Me','me']];const tp={pref,toast,flags,bump,addGroup,note,ver:vOK,me,pub:pub.filter(z=>z.status!=='cancelled'),publish,openChat,onEdit,onCancel,trips,setTrips,remind};const mp={pub,trips,setTrips,onEdit,onCancel,demoJoin,updPub,toast};
 let body;
 if(stage==='boot') body=<div className="h-full grid place-items-center"><Logo s={72}/></div>;
 else if(stage==='login') body=<GLogin/>;
 else if(stage==='pending') body=<Pending2 onLogout={()=>FB.logout()}/>;
 else if(stage==='onboard') body=<Onboard onLegal={setLegal} err={obErr} done={async d=>{setObErr('');try{await FB.create(d)}catch(e){setObErr(e&&e.code==='permission-denied'?'That group code is not correct. Please check it.':'Could not save. Please try again.')}}}/>;
 else if(stage==='prefs') body=<div className="h-full overflow-y-auto noscroll"><Prefs me={me} done={async d=>{toast('Saving…');try{await FB.savePref(d)}catch(e){toast('Could not save. Please try again.')}}}/></div>;
 else if(stage==='face') body=<FaceStep/>;
 else if(stage==='verify') body=<div className="h-full overflow-y-auto noscroll px-6 pt-10"><h2 className="font-display text-3xl font-bold">{t('Get verified')}</h2><VerifyPanel2 me={me} ver={ver} setVer={setVer} vx={vx} setVx={setVx}/><div className="mt-6"><Btn dis={!vOK} onClick={()=>setStage('pending')}>Submit profile for approval</Btn></div></div>;
 else body=<div className="flex flex-col h-full">
  <div className="flex items-center justify-between px-5 pt-3"><span className="flex items-center gap-2"><Logo s={30}/><span className="font-display text-xl font-bold text-gold">Joyn</span></span><div className="flex gap-1 items-center"><button aria-label="Search" onClick={()=>setSrch(true)} className="w-10 h-10 rounded-full text-lg text-[#d8cde3]">🔍</button>{srch&&<SearchSheet onClose={()=>setSrch(false)} favs={favs} setFavs={setFavs} toast={toast}/>}{[['map','map','Nearby'],['chats','chat','Chats'],['alerts','bell','Alerts']].map(([k,ic,lb])=><button key={k} aria-label={lb} onClick={()=>{if(tab==='alerts')setNotes(n=>n.map(z=>({...z,new:false})));setTab(k)}} className={`relative w-14 flex flex-col items-center gap-0.5 py-1 rounded-2xl ${tab===k?'bg-gold/20 text-gold':'text-[#d8cde3]'}`}><Ico k={ic} s={20}/><span className="text-[10px] leading-none">{lb}</span>{k==='alerts'&&(notes.some(z=>z.new)||reqs.length>0)&&<span className="absolute top-1 right-3 w-2 h-2 rounded-full bg-rose"/>}</button>)}</div></div>
  <div className="flex-1 overflow-y-auto noscroll"><CelebBanner prof={prof}/>{tab==='discover'?<DiscoverX updStory={updStory} delStory={delStory} toast={toast} flags={flags} note={note} km={km} setKm={setKm} accept={accept} matched={matched} block={block} stories={stories} addStory={addStory} vouch={vouch} vouched={vouched} vcOf={vcOf} canVouch={vOK}/>:tab==='map'?<MapView toast={toast} km={km} setKm={setKm}/>:tab==='dating'?<Dating {...tp}/>:tab==='events'?<EventsTab {...tp}/>:tab==='groups'?<GroupsTab {...tp} goChats={()=>setTab('chats')}/>:tab==='alerts'?<Alerts notes={notes} reqs={reqs.filter(r=>!isB(r.n))} flags={flags} onAccept={onAccept} onReject={onReject} onAct={onAct}/>:tab==='trips'?<TripsTab {...tp}/>:tab==='chats'?<ChatsX sens={ps.sens!==false} msgs={msgs} setMsgs={setMsgs} flags={flags} toast={toast} block={block} gmeta={gmeta} setGmeta={setGmeta}/>:<MeTab nPrefs={np} setNPrefs={setNp} pf={{prof,setProf,me,pref,setPref,toast}} ps={ps} setPs={setPs} mp={mp} pref={pref} setPref={setPref} me={me} ver={ver} setVer={setVer} toast={toast} lang={lang} setLang={setLang} onLegal={setLegal} onDelete={onDelete} blocked={blocked} unblock={unblock} onLogout={()=>FB.logout()} vx={vx} setVx={setVx} myMet={myMet} vouches={myVouches} askVouch={askVouch} goHome={()=>setTab('discover')}/>}</div>
  <nav className="flex border-t border-line bg-ink px-1 pt-2 pb-2" aria-label="Main menu">{tabs.map(([k,l,ic])=><button key={k} aria-current={tab===k?'page':undefined} onClick={()=>{if(tab==='alerts')setNotes(n=>n.map(z=>({...z,new:false})));setTab(k)}} className="flex-1 flex flex-col items-center gap-1 text-[11px]"><span className={`px-4 py-1 rounded-full transition-colors ${tab===k?'bg-gold text-ink shadow-[0_6px_16px_-6px_rgba(242,200,121,.9)]':'text-mute'}`}><Ico k={ic} s={22}/></span><span className={tab===k?'text-gold font-bold':'text-mute'}>{t(l)}</span></button>)}</nav></div>;
 return <div className="h-full flex justify-center bg-[#0b0810]">
  <div className="relative w-full max-w-[420px] h-full bg-ink md:border-x md:border-line overflow-hidden" style={{backgroundImage:'radial-gradient(120% 55% at 100% 0%,rgba(232,80,127,.12),transparent 60%),radial-gradient(90% 45% at 0% 100%,rgba(242,200,121,.07),transparent 60%)'}}>{body}
   {legal&&<Legal start={legal} onClose={()=>setLegal(null)}/>}
   {rpt&&<ReportSheet who={rpt} onClose={()=>setRpt(null)} toast={toast}/>}
   {msg&&<div role="status" className="absolute bottom-20 left-1/2 -translate-x-1/2 max-w-[90%] text-center bg-gold text-ink text-sm font-bold rounded-2xl px-5 py-2 shadow-lg z-40">{msg}</div>}</div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
